; Perfil de Wii Remote emulado via TECLADO + mouse para o Dolphin.
; Substitui o controle físico sem modificar o main.dol.
; Instalação: copie para ~/.local/share/dolphin-emu/Config/Profiles/Wiimote/
; (Windows: Documentos\Dolphin Emulator\Config\Profiles\Wiimote\)
; No Dolphin: Controles > Wii Remote 1 = "Emulated Wii Remote" > Configurar > Perfil: linuxsports_teclado > Carregar.
; O dispositivo "XInput2/0/Virtual core pointer" é o teclado+mouse padrão no Linux/X11;
; no Windows troque por "DInput/0/Keyboard Mouse".

[Profile]
Device = XInput2/0/Virtual core pointer
Buttons/A = Z
Buttons/B = X
Buttons/1 = `1`
Buttons/2 = `2`
Buttons/- = Q
Buttons/+ = E
Buttons/Home = Return
D-Pad/Up = Up
D-Pad/Down = Down
D-Pad/Left = Left
D-Pad/Right = Right
; Ponteiro (menus) segue o mouse
IR/Up = `Cursor Y-`
IR/Down = `Cursor Y+`
IR/Left = `Cursor X-`
IR/Right = `Cursor X+`
; Movimentos (tacada, saque, arremesso, soco)
Swing/Up = W
Swing/Down = S
Swing/Left = A
Swing/Right = D
Swing/Forward = F
Swing/Backward = G
Shake/X = Space
Shake/Y = Space
Shake/Z = Space
Tilt/Forward = I
Tilt/Backward = K
Tilt/Left = J
Tilt/Right = L
Tilt/Modifier = Shift_L
; Nunchuk (necessário no Boxe)
Extension = Nunchuk
Nunchuk/Buttons/C = C
Nunchuk/Buttons/Z = V
Nunchuk/Stick/Up = T
Nunchuk/Stick/Down = B
Nunchuk/Stick/Left = Y
Nunchuk/Stick/Right = U
Nunchuk/Shake/X = H
Nunchuk/Shake/Y = H
Nunchuk/Shake/Z = H
Nunchuk/Swing/Forward = N
Nunchuk/Swing/Backward = M
